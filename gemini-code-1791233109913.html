<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHWH INDUSTRIES - Gestión de Actividades</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">
    <!-- HEADER -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <svg class="w-10 h-10 text-emerald-600" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 75 L45 25 L58 48 L45 75 Z" fill="#0d9488" />
                    <path d="M38 75 L70 15 L88 50 L75 75 Z" fill="#059669" />
                    <path d="M72 75 L88 45 L88 75 Z" fill="#042f2e" />
                </svg>
                <div class="flex flex-col">
                    <span class="text-2xl font-black tracking-wider text-black leading-none">YHWH</span>
                    <span class="text-xs font-bold tracking-widest text-gray-600 uppercase">INDUSTRIES</span>
                </div>
            </div>
            <div class="bg-[#042f2e] p-1.5 rounded-2xl flex items-center shadow-inner">
                <button id="btnNavRegistro" onclick="switchMainTab('registro')" class="flex items-center space-x-2 px-6 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-[#10b981] text-white shadow-md">
                    <i class="fa-solid fa-clipboard-list text-base"></i>
                    <span>Registro</span>
                </button>
                <button id="btnNavValidacion" onclick="switchMainTab('validacion')" class="flex items-center space-x-2 px-6 py-2 rounded-xl text-sm font-semibold transition-all duration-200 text-teal-100 hover:text-white">
                    <i class="fa-regular fa-circle-check text-base"></i>
                    <span>Validación</span>
                </button>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="promptAdminAuth('manageUsers')" class="flex items-center space-x-2 px-3.5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-users-gear text-emerald-600"></i>
                    <span class="hidden md:inline">Usuarios</span>
                </button>
                <button onclick="exportToExcel()" class="flex items-center space-x-2 px-3.5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-sm font-medium transition shadow-sm">
                    <i class="fa-solid fa-file-excel"></i>
                    <span class="hidden md:inline">Exportar Excel</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        <div id="cloudStatus" class="bg-amber-100 border border-amber-300 text-amber-800 px-4 py-2 rounded-lg text-xs font-medium flex items-center justify-between">
            <span id="cloudStatusText"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Conectando con Supabase...</span>
            <span class="text-[10px] bg-amber-200 px-2 py-0.5 rounded font-bold uppercase">Estado</span>
        </div>
        <!-- FILTROS Y BÚSQUEDA -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-1 bg-gray-100 p-1 rounded-lg text-xs md:text-sm font-medium">
                <button onclick="filterPeriod('all')" id="period-all" class="period-btn px-3 py-1.5 rounded-md bg-white text-gray-800 shadow-sm font-bold">Todos</button>
            </div>
            <div class="flex items-center space-x-3 flex-1 sm:flex-initial">
                <div class="relative flex-1 sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderActivitiesFromData(globalActivities)" placeholder="Buscar actividad..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <button onclick="openNewActivityModal()" class="flex items-center space-x-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg shadow transition whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nueva Actividad</span>
                </button>
            </div>
        </div>
        <!-- TARJETAS DE MÉTRICAS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <p class="text-xs font-semibold text-gray-500 uppercase">Total Actividades</p>
                <p id="statTotal" class="text-2xl font-bold text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <p class="text-xs font-semibold text-amber-600 uppercase">En Proceso</p>
                <p id="statPending" class="text-2xl font-bold text-amber-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <p class="text-xs font-semibold text-blue-600 uppercase">En Validación</p>
                <p id="statValidation" class="text-2xl font-bold text-blue-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <p class="text-xs font-semibold text-emerald-600 uppercase">Completadas</p>
                <p id="statCompleted" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
            </div>
        </div>
        <div id="activitiesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div id="emptyState" class="hidden text-center py-12 bg-white rounded-xl border border-dashed border-gray-300">
            <i class="fa-solid fa-folder-open text-4xl text-gray-300 mb-3"></i>
            <p class="text-gray-500 font-medium">No se encontraron actividades registradas.</p>
        </div>
    </main>

    <!-- MODAL NUEVA ACTIVIDAD -->
    <div id="modalNewActivity" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('modalNewActivity')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-circle-plus text-emerald-600"></i>
                <span>Crear Nueva Actividad</span>
            </h3>
            <form onsubmit="handleCreateActivity(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Título</label>
                    <input type="text" id="actTitle" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Descripción</label>
                    <textarea id="actDesc" rows="3" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Asignar a</label>
                        <select id="actUser" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Prioridad</label>
                        <select id="actPriority" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="Baja">Baja</option>
                            <option value="Media" selected>Media</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Fecha Límite</label>
                    <input type="date" id="actDueDate" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div class="pt-2 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('modalNewActivity')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium">Guardar Actividad</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // DATOS DE SUPABASE CONFIGURADOS
        const SUPABASE_URL = "https://vgvchvklacatwdblkryd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_7AKEPFVCbrNaJjO5dNN6Cw_8r7GKxrV";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let globalActivities = [];
        let defaultUsers = ["Operador 1", "Operador 2", "Supervisor"];
        let currentTab = 'registro';

        async function fetchActivities() {
            const { data, error } = await supabase.from('actividades').select('*');
            if (error) {
                console.error("Error al cargar actividades:", error);
                document.getElementById("cloudStatus").className = "bg-red-100 border border-red-300 text-red-800 px-4 py-2 rounded-lg text-xs font-medium flex items-center justify-between";
                document.getElementById("cloudStatusText").innerText = "Error de conexión con Supabase.";
            } else {
                document.getElementById("cloudStatus").className = "bg-emerald-100 border border-emerald-300 text-emerald-800 px-4 py-2 rounded-lg text-xs font-medium flex items-center justify-between";
                document.getElementById("cloudStatusText").innerHTML = '<i class="fa-solid fa-circle-check mr-1.5"></i> Conectado a Supabase Cloud';
                globalActivities = data || [];
                renderActivitiesFromData(globalActivities);
            }
        }

        async function handleCreateActivity(e) {
            e.preventDefault();
            const newAct = {
                title: document.getElementById('actTitle').value,
                desc: document.getElementById('actDesc').value,
                user: document.getElementById('actUser').value,
                priority: document.getElementById('actPriority').value,
                dueDate: document.getElementById('actDueDate').value,
                status: 'En Proceso',
                createdAt: new Date().toISOString()
            };

            const { error } = await supabase.from('actividades').insert([newAct]);
            if (!error) {
                e.target.reset();
                closeModal('modalNewActivity');
                fetchActivities();
            } else {
                alert("Error al guardar: " + error.message);
            }
        }

        async function updateStatus(id, newStatus) {
            const { error } = await supabase.from('actividades').update({ status: newStatus }).eq('id', id);
            if (!error) fetchActivities();
        }

        async function deleteActivity(id) {
            if (confirm('¿Deseas eliminar esta actividad?')) {
                const { error } = await supabase.from('actividades').delete().eq('id', id);
                if (!error) fetchActivities();
            }
        }

        function populateUserDropdown() {
            const userSelect = document.getElementById('actUser');
            userSelect.innerHTML = defaultUsers.map(u => `<option value="${u}">${u}</option>`).join('');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function openNewActivityModal() { populateUserDropdown(); openModal('modalNewActivity'); }

        function switchMainTab(tab) {
            currentTab = tab;
            renderActivitiesFromData(globalActivities);
        }

        function renderActivitiesFromData(activities) {
            const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const list = document.getElementById('activitiesList');
            const empty = document.getElementById('emptyState');

            let filtered = activities.filter(a => 
                ((a.title || '').toLowerCase().includes(query) || 
                 (a.desc || '').toLowerCase().includes(query) || 
                 (a.user || '').toLowerCase().includes(query))
            );

            if(currentTab === 'validacion') {
                filtered = filtered.filter(a => a.status === 'En Validación');
            }

            document.getElementById('statTotal').innerText = activities.length;
            document.getElementById('statPending').innerText = activities.filter(a => a.status === 'En Proceso').length;
            document.getElementById('statValidation').innerText = activities.filter(a => a.status === 'En Validación').length;
            document.getElementById('statCompleted').innerText = activities.filter(a => a.status === 'Completadas').length;

            list.innerHTML = '';
            if(filtered.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                filtered.forEach(a => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between space-y-4";
                    
                    let badgeColor = "bg-gray-100 text-gray-700";
                    if(a.priority === 'Alta') badgeColor = "bg-red-100 text-red-700";
                    if(a.priority === 'Media') badgeColor = "bg-amber-100 text-amber-700";

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold px-2.5 py-1 rounded-full ${badgeColor}">${a.priority || 'Normal'}</span>
                                <span class="text-xs text-gray-500"><i class="fa-regular fa-calendar mr-1"></i>${a.dueDate || 'Sin fecha'}</span>
                            </div>
                            <h4 class="font-bold text-gray-900">${a.title || 'Sin Título'}</h4>
                            <p class="text-sm text-gray-600 mt-1">${a.desc || ''}</p>
                        </div>
                        <div class="pt-3 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-xs text-gray-600 font-semibold"><i class="fa-regular fa-user mr-1 text-emerald-600"></i>${a.user || 'Sin asignar'}</span>
                            <div class="flex items-center space-x-2">
                                ${a.status === 'En Proceso' ? `<button onclick="updateStatus(${a.id}, 'En Validación')" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded hover:bg-blue-100 font-semibold transition">Validar</button>` : ''}
                                ${a.status === 'En Validación' ? `<button onclick="updateStatus(${a.id}, 'Completadas')" class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded hover:bg-emerald-100 font-semibold transition">Completar</button>` : ''}
                                <button onclick="deleteActivity(${a.id})" class="text-xs text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            }
        }

        function exportToExcel() {
            if(globalActivities.length === 0) return alert('No hay actividades cargadas.');
            const ws = XLSX.utils.json_to_sheet(globalActivities);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Actividades");
            XLSX.writeFile(wb, "YHWH_Actividades.xlsx");
        }

        populateUserDropdown();
        fetchActivities();
    </script>
</body>
</html>
